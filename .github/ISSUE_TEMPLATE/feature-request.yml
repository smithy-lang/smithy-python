---
name: 🚀 Feature Request
description: Suggest an idea for this project
title: "(short issue description)"
labels: [enhancement, needs-triage]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: A clear and concise description of the feature you are proposing.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: |
        Why do you need this feature? For example: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        Suggest how to implement the addition or change. Please include prototype/workaround/sketch/reference implementation.
    validations:
      required: false
  - type: textarea
    id: other
    attributes:
      label: Other Information
      description: |
        Any alternative solutions or features you considered, a more detailed explanation, tracebacks, related issues, links for context, etc.
    validations:
      required: false
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgements
      options:
        - label: I may be able to implement this feature request
          required: false
        - label: This feature might incur a breaking change
          required: false

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of the project would this feature apply to? Select all that apply.
      multiple: true
      options:
        - codegen (Java code generator)
        - aws-sdk-signers
        - smithy-aws-core
        - smithy-aws-event-stream
        - smithy-core
        - smithy-http
        - smithy-json
        - smithy-python
        - smithy-xml
        - generated client code
        - other / not sure
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Version used
      description: Version of the relevant package(s), or the commit SHA if running from source.
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version used
      description: Output of `python --version`
    validations:
      required: false
