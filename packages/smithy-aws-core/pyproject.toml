[project]
name = "smithy-aws-core"
dynamic = ["version"]
requires-python = ">=3.12"
authors = [
  {name = "Amazon Web Services"},
]
description = "Core Smithy components for AWS services and protocols."
readme = "README.md"
license = {text = "Apache License 2.0"}
keywords = ["aws", "sdk", "amazon", "smithy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Software Development :: Libraries"
]
dependencies = [
    "smithy-core~=0.10.0",
    "smithy-http~=0.7.0",
    "aws-sdk-signers~=0.5.0"
]

[project.urls]
"Changelog" = "https://github.com/smithy-lang/smithy-python/blob/develop/packages/smithy-aws-core/CHANGELOG.md"
"Code" = "https://github.com/smithy-lang/smithy-python/blob/develop/packages/smithy-aws-core/"
"Issue tracker" = "https://github.com/smithy-lang/smithy-python/issues"

# The built-in providers create resolvers in the mode of the chain that runs them.
[project.entry-points."smithy_aws_core.aio.identity.chain_providers"]
Environment = "smithy_aws_core.identity.chain.providers.environment:EnvironmentCredentialsProvider"
SharedConfig = "smithy_aws_core.identity.chain.providers.shared_config:SharedConfigProvider"
ProfileSessionKeys = "smithy_aws_core.identity.chain.providers.profile:ProfileSessionCredentialsProvider"
ProfileStaticKeys = "smithy_aws_core.identity.chain.providers.profile:ProfileStaticCredentialsProvider"
ProfileCredentialProcess = "smithy_aws_core.identity.chain.providers.process:ProfileCredentialProcessProvider"

[project.entry-points."smithy_aws_core.identity.chain_providers"]
Environment = "smithy_aws_core.identity.chain.providers.environment:EnvironmentCredentialsProvider"
SharedConfig = "smithy_aws_core.identity.chain.providers.shared_config:SharedConfigProvider"
ProfileSessionKeys = "smithy_aws_core.identity.chain.providers.profile:ProfileSessionCredentialsProvider"
ProfileStaticKeys = "smithy_aws_core.identity.chain.providers.profile:ProfileStaticCredentialsProvider"
ProfileCredentialProcess = "smithy_aws_core.identity.chain.providers.process:ProfileCredentialProcessProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/smithy_aws_core/__init__.py"

[project.optional-dependencies]
checksums = [
    "smithy-checksums~=0.1.0"
]
eventstream = [
    "smithy-aws-event-stream~=0.4.0"
]
json = [
    "smithy-json~=0.4.0"
]
xml = [
    "smithy-xml~=0.3.0"
]

[tool.hatch.build]
exclude = [
  "tests",
]

[tool.ruff]
src = ["src"]
