[project]
name = "smithy-python"
version = "0.1.0"
requires-python = ">=3.12"
authors = [
  {name = "Amazon Web Services"},
]
description = "Python-native code generation for Smithy Python clients and types."
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["smithy", "codegen", "sdk"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
smithy-python = "smithy_python.cli:main"

[project.entry-points."smithy_python.codegen.plugins"]
aws = "smithy_python.integrations.aws:AwsPlugin"
rest_json = "smithy_python.integrations.rest_json:RestJsonPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["tests"]

[tool.ruff]
src = ["src"]
